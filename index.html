<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Quick Notes</title>
<meta name="theme-color" content="#f6f3ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17161a" media="(prefers-color-scheme: dark)">
<meta name="description" content="Quick notes saved as Markdown files in Google Drive.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  /* Two views: the notes grid (opens first) and a note's canvas. System fonts only, so it opens fast. */
  :root {
    --paper: #f6f3ec; --surface: #ffffff; --ink: #22201c; --muted: #6d675d; --rule: #e2ddd2;
    --accent: #8a5a12; --accent-soft: #f3e6cf; --accent-ink: #ffffff;
    --warn-bg: #fbefd5; --warn-ink: #5e4300; --bad: #a33a2b; --mark: #fde68a;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --radius: 12px; --shadow: 0 8px 28px rgba(0,0,0,.18);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #17161a; --surface: #211f24; --ink: #ebe7df; --muted: #a39d93; --rule: #34313a;
      --accent: #e9b25e; --accent-soft: #3a2f1d; --accent-ink: #1d1404; --warn-bg: #3a3017; --warn-ink: #f3dc9a; --bad: #f08a7a; --mark: #6b5414;
      --shadow: 0 8px 28px rgba(0,0,0,.5);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--paper); color: var(--ink); font: 16px/1.5 var(--font); -webkit-tap-highlight-color: transparent;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  .hidden { display: none !important; }
  svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; display: block; }

  button { font: 500 15px/1 var(--font); color: var(--ink); background: var(--surface); border: 1px solid var(--rule);
    border-radius: 10px; padding: 10px 13px; cursor: pointer; min-height: 40px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  button.ghost { background: transparent; border-color: transparent; }
  button.icon { padding: 0; width: 40px; height: 40px; display: inline-grid; place-items: center; background: transparent; border-color: transparent; }
  button.icon[aria-pressed="true"], button.tool[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
  button:disabled { opacity: .4; cursor: default; }
  button.danger { color: var(--bad); }
  button:focus-visible, input:focus-visible, .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input[type=text], input[type=search] { font: 16px var(--font); color: var(--ink); background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 10px 12px; width: 100%; }

  .bar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 4px; padding: 6px 8px; background: var(--paper); }
  .bar h1 { flex: 1; min-width: 0; margin: 0 4px; font: 600 19px/1.2 var(--font); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar .spacer { flex: 1; }
  .pill { font-size: 13px; padding: 7px 11px; min-height: 34px; border-radius: 999px; color: var(--muted); white-space: nowrap; }
  .pill.waiting { color: var(--warn-ink); background: var(--warn-bg); border-color: transparent; }
  .pill.bad { color: var(--bad); }
  .pill .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: currentColor; margin-right: 6px; vertical-align: 1px; }

  .notice { border-radius: var(--radius); padding: 12px 14px; margin: 8px 12px; background: var(--warn-bg); color: var(--warn-ink); font-size: 15px; }
  .notice b { display: block; margin-bottom: 4px; }
  .notice .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }

  /* ---------- Home: notes grid ---------- */
  #listView main { max-width: 1100px; margin: 0 auto; padding: 0 14px 20px; }
  .searchwrap { position: relative; margin: 2px 0 10px; }
  .searchwrap input { border-radius: 999px; padding: 11px 16px 11px 42px; }
  .searchwrap svg.i { position: absolute; left: 14px; top: 12px; color: var(--muted); }
  .recent { position: absolute; left: 0; right: 0; top: 48px; z-index: 15; background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; box-shadow: var(--shadow); padding: 6px; }
  .recent div { display: flex; align-items: center; gap: 8px; padding: 9px 10px; border-radius: 8px; cursor: pointer; }
  .recent div:hover { background: var(--paper); }
  .recent div span { flex: 1; }
  .recent button { min-height: 0; padding: 2px 6px; border: 0; background: transparent; color: var(--muted); }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 6px; scrollbar-width: none; }
  .chips:empty { display: none; }
  .chips button { flex: none; font-size: 14px; min-height: 34px; padding: 7px 12px; border-radius: 999px; }
  .chips button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
  .crumbs { font-size: 13px; color: var(--muted); margin: 0 2px 8px; }
  .crumbs:empty { display: none; }
  .crumbs a { color: var(--accent); cursor: pointer; text-decoration: none; }
  .folders { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-bottom: 6px; }
  .folder { display: flex; align-items: center; gap: 8px; padding: 11px 12px; border: 1px solid var(--rule); border-radius: 10px; background: var(--surface); cursor: pointer; font-size: 15px; min-width: 0; }
  .folder span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .folder small { color: var(--muted); }
  .folder svg.i { color: var(--accent); flex: none; }
  .section-head { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 16px 4px 8px; }
  .grid { columns: 2 170px; column-gap: 10px; }
  .card { position: relative; break-inside: avoid; margin: 0 0 10px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--rule);
    border-radius: var(--radius); cursor: pointer; overflow-wrap: anywhere; }
  .card h3 { margin: 0 0 4px; font: 600 16px/1.3 var(--font); padding-right: 18px; }
  .card .pin { position: absolute; top: 10px; right: 10px; color: var(--accent); }
  .card .pin svg.i { width: 16px; height: 16px; }
  .card .prev { font-size: 15px; max-height: 280px; overflow: hidden; }
  .card .prev.long { -webkit-mask-image: linear-gradient(#000 80%, transparent); mask-image: linear-gradient(#000 80%, transparent); }
  .card .prev p, .card .prev ul, .card .prev ol, .card .prev h1, .card .prev h2, .card .prev h3, .card .prev blockquote { margin: 0 0 6px; }
  .card .prev h1, .card .prev h2, .card .prev h3 { font-size: 16px; }
  .card .prev ul, .card .prev ol { padding-left: 20px; }
  .card .prev li.task { list-style: none; margin-left: -20px; display: flex; gap: 8px; align-items: flex-start; }
  .card .prev li.task input { margin: 4px 0 0; width: 17px; height: 17px; flex: none; accent-color: var(--accent); }
  .card .prev li.task.done { color: var(--muted); text-decoration: line-through; }
  img.qn-img { max-width: 100%; height: auto; border-radius: 8px; display: block; margin: 4px 0; }
  img.qn-img.pending { min-height: 48px; min-width: 80px; background: var(--accent-soft); }
  .card .prev img.qn-img { max-height: 220px; object-fit: cover; }
  .card .ink-thumb { display: block; max-width: 100%; height: auto; margin-top: 6px; }
  .card .foot { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; align-items: center; }
  .chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; line-height: 1; padding: 5px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--ink); }
  .chip button { min-height: 0; padding: 0 2px; border: 0; background: transparent; color: var(--muted); font-size: 15px; }
  .flag { font-size: 12px; color: var(--warn-ink); background: var(--warn-bg); border-radius: 999px; padding: 3px 8px; }
  .where { font-size: 12px; color: var(--muted); }
  .results .card { margin-bottom: 8px; }
  .results .snip { font-size: 14px; color: var(--muted); margin-top: 4px; }
  mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }
  .empty { color: var(--muted); padding: 24px 4px; }
  .fab { position: fixed; z-index: 25; width: 56px; height: 56px; border-radius: 18px; display: grid; place-items: center; padding: 0;
    box-shadow: var(--shadow); bottom: calc(18px + env(safe-area-inset-bottom)); }
  .fab svg.i { width: 26px; height: 26px; }
  #newFab { right: 18px; }
  footer { max-width: 1100px; margin: 0 auto; padding: 24px 14px 100px; font-size: 12px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  footer button { font-size: 12px; padding: 6px 9px; min-height: 0; }

  /* Folders drawer */
  .drawer-back { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.35); }
  .drawer { position: fixed; z-index: 41; top: 0; bottom: 0; left: 0; width: min(330px, 86vw); background: var(--paper); box-shadow: var(--shadow);
    padding: calc(12px + env(safe-area-inset-top)) 10px calc(12px + env(safe-area-inset-bottom)); overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
  .drawer h2 { font: 600 18px/1.3 var(--font); margin: 4px 8px 10px; }
  .tree-row { display: flex; align-items: center; gap: 2px; border-radius: 10px; min-height: 44px; padding-right: 2px; }
  .tree-row.on { background: var(--accent-soft); }
  .tree-row .tw { width: 28px; height: 32px; min-height: 0; padding: 0; border: 0; background: transparent; color: var(--muted); flex: none; display: grid; place-items: center; }
  .tree-row .tw svg.i { width: 16px; height: 16px; }
  .tree-row .nm { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; padding: 8px 4px; cursor: pointer; }
  .tree-row .nm svg.i { color: var(--accent); flex: none; }
  .tree-row .nm span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tree-row .nm small { color: var(--muted); margin-left: auto; }
  .tree-row .more { width: 34px; height: 34px; min-height: 0; padding: 0; border: 0; background: transparent; color: var(--muted); flex: none; display: grid; place-items: center; }
  .drawer .add { margin: 10px 8px 0; }

  /* ---------- A note ---------- */
  #editorView { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--paper);
    padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); }
  #editorView .bar { position: static; }
  .tools { display: flex; align-items: center; gap: 2px; padding: 0 8px 4px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--rule); flex: none; }
  .tools .tool { display: inline-flex; align-items: center; gap: 6px; padding: 7px 10px; min-height: 36px; border-color: transparent; background: transparent; font-size: 14px; flex: none; }
  .tools .sep { width: 1px; height: 22px; background: var(--rule); margin: 0 6px; flex: none; }
  .swatch { width: 26px; height: 26px; min-height: 0; padding: 0; border-radius: 50%; border: 2px solid var(--rule); flex: none; margin: 0 2px; }
  .swatch[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--paper) inset; }
  .size { width: 32px; height: 32px; min-height: 0; padding: 0; display: inline-grid; place-items: center; border-color: transparent; background: transparent; flex: none; }
  .size i { display: block; border-radius: 50%; background: var(--ink); }
  .size[aria-pressed="true"] { background: var(--accent-soft); }
  #canvasWrap { flex: 1; min-height: 0; overflow: auto; position: relative; overscroll-behavior: contain; padding-bottom: 80px; }
  #noteHead { padding: 8px 16px 0; position: sticky; left: 0; max-width: 100vw; }
  #noteTitle { display: block; width: 100%; outline: 0; color: var(--ink); font: 600 22px/1.3 var(--font); }
  #noteMeta { font-size: 12px; color: var(--muted); }
  #noteLabels { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  #noteLabels:empty { display: none; }
  ::placeholder { color: var(--muted); opacity: .8; }

  .stage { position: relative; touch-action: none; }
  .ink-layer { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }
  .box { position: absolute; min-height: 32px; border-radius: 6px; touch-action: pan-x pan-y; }
  .box.focused { box-shadow: 0 0 0 1px var(--rule); }
  .stage[data-tool=pen] .box, .stage[data-tool=highlighter] .box, .stage[data-tool=eraser] .box { pointer-events: none; }
  .stage[data-tool=select] .box { cursor: move; outline: 1px dashed var(--rule); touch-action: none; }
  .stage[data-tool=select] .box .ed { pointer-events: none; }
  .box .grip { position: absolute; left: -20px; top: 2px; width: 20px; height: 30px; display: none; place-items: center; color: var(--muted); cursor: grab; touch-action: none; }
  .box .grip svg { fill: currentColor; }
  .box.focused .grip, .box.selected .grip { display: grid; }
  .box .resize { position: absolute; right: -10px; top: 0; bottom: 0; width: 18px; cursor: ew-resize; display: none; touch-action: none; }
  .box.selected .resize, .box.focused .resize { display: block; }
  .box .resize::after { content: ""; position: absolute; left: 7px; top: 50%; width: 4px; height: 28px; margin-top: -14px; border-radius: 2px; background: var(--muted); opacity: .5; }
  .stage[data-tool=pen], .stage[data-tool=highlighter] { cursor: crosshair; }
  .stage[data-tool=eraser] { cursor: cell; }
  .sel { position: absolute; border: 1.5px dashed var(--accent); border-radius: 8px; pointer-events: none; }
  .selbar { position: absolute; z-index: 5; display: flex; gap: 6px; }
  .selbar button { min-height: 34px; padding: 6px 12px; font-size: 14px; box-shadow: var(--shadow); }

  /* The rich text inside a box */
  .ed .ProseMirror { outline: none; font: 17px/1.55 var(--font); color: var(--ink); min-height: 28px; padding: 2px; word-wrap: break-word; white-space: pre-wrap; }
  .ed .ProseMirror > *:first-child { margin-top: 0; }
  .ed .ProseMirror p { margin: 0 0 .35em; }
  .ed .ProseMirror h1 { font-size: 1.5em; margin: .3em 0; line-height: 1.25; }
  .ed .ProseMirror h2 { font-size: 1.25em; margin: .3em 0; line-height: 1.3; }
  .ed .ProseMirror h3 { font-size: 1.1em; margin: .3em 0; }
  .ed .ProseMirror ul, .ed .ProseMirror ol { padding-left: 24px; margin: .2em 0 .4em; }
  .ed .ProseMirror blockquote { margin: .3em 0; padding-left: 12px; border-left: 3px solid var(--rule); color: var(--muted); }
  .ed .ProseMirror a { color: var(--accent); }
  .ed .ProseMirror code { background: var(--accent-soft); border-radius: 4px; padding: 0 3px; }
  .ed .ProseMirror ul[data-type="taskList"] { list-style: none; padding-left: 2px; }
  .ed .ProseMirror ul[data-type="taskList"] li { display: flex; gap: 8px; align-items: flex-start; }
  .ed .ProseMirror ul[data-type="taskList"] li > label { flex: none; margin-top: 3px; }
  .ed .ProseMirror ul[data-type="taskList"] li > label input { width: 19px; height: 19px; accent-color: var(--accent); }
  .ed .ProseMirror ul[data-type="taskList"] li > div { flex: 1; min-width: 0; }
  .ed .ProseMirror ul[data-type="taskList"] li[data-checked="true"] > div { color: var(--muted); text-decoration: line-through; }
  .ed .ProseMirror p.is-editor-empty:first-child::before { content: attr(data-placeholder); color: var(--muted); opacity: .8; float: left; height: 0; pointer-events: none; }

  /* Formatting bar: shows while typing, just above the keyboard */
  #fmtBar { position: fixed; left: 0; right: 0; z-index: 30; bottom: 0; display: flex; gap: 2px; align-items: center; overflow-x: auto; scrollbar-width: none;
    padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); background: var(--surface); border-top: 1px solid var(--rule); }
  #fmtBar button { flex: none; min-width: 38px; height: 38px; min-height: 0; padding: 0 8px; border-color: transparent; background: transparent; font-size: 15px; }
  #fmtBar button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
  #fmtBar .sep { width: 1px; height: 22px; background: var(--rule); margin: 0 4px; flex: none; }
  #fmtBar .dot { display: inline-block; width: 16px; height: 16px; border-radius: 50%; vertical-align: middle; }
  .pop { position: fixed; z-index: 35; background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; box-shadow: var(--shadow); padding: 8px; display: flex; flex-wrap: wrap; gap: 6px; max-width: 290px; }
  .pop button { min-height: 36px; }
  .pop .swatch { width: 30px; height: 30px; }

  /* The note menu: a round button in the bottom-left corner */
  #menuFab { left: 16px; width: 48px; height: 48px; border-radius: 16px; }
  #menuFab.lift { bottom: calc(66px + env(safe-area-inset-bottom)); }
  #noteMenu { position: fixed; left: 16px; z-index: 36; bottom: calc(76px + env(safe-area-inset-bottom)); min-width: 240px; max-width: calc(100vw - 32px);
    background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; box-shadow: var(--shadow); padding: 6px; }
  #noteMenu.lift { bottom: calc(124px + env(safe-area-inset-bottom)); }
  #noteMenu > button { display: flex; width: 100%; align-items: center; gap: 12px; border: 0; background: transparent; padding: 12px; text-align: left; font-size: 15px; }
  #noteMenu > button:hover { background: var(--paper); }
  #noteMenu .space { display: flex; align-items: center; gap: 4px; padding: 6px 12px; font-size: 14px; color: var(--muted); }
  #noteMenu .space span { flex: 1; }
  #noteMenu .space button { width: 38px; height: 38px; min-height: 0; padding: 0; }
  #noteMenu hr { border: 0; border-top: 1px solid var(--rule); margin: 4px 0; }

  /* Sheets (dialogs) */
  .sheet-back { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.35); display: flex; align-items: flex-end; justify-content: center; }
  .sheet { width: 100%; max-width: 560px; max-height: 85vh; overflow: auto; background: var(--paper); border-radius: 18px 18px 0 0;
    padding: 18px 18px calc(18px + env(safe-area-inset-bottom)); }
  @media (min-width: 700px) { .sheet-back { align-items: center; } .sheet { border-radius: 18px; } }
  .sheet h2 { margin: 0 0 6px; font: 600 18px/1.3 var(--font); }
  .sheet p { margin: 0 0 12px; color: var(--muted); font-size: 15px; }
  .sheet ul { margin: 0 0 14px; padding-left: 18px; font-size: 15px; }
  .sheet .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .sheet .pick { display: flex; flex-direction: column; gap: 2px; margin: 8px 0; max-height: 50vh; overflow: auto; }
  .sheet .pick button { text-align: left; border: 0; background: transparent; display: flex; gap: 8px; align-items: center; }
  .sheet .pick button svg.i { color: var(--accent); flex: none; }
  .sheet .pick button[aria-pressed="true"] { background: var(--accent-soft); }
  .sheet .labels { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .sheet .labels button { border-radius: 999px; min-height: 34px; padding: 6px 12px; font-size: 14px; }
  .sheet .labels button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
  .sheet .err { color: var(--bad); font-size: 14px; margin-top: 8px; }
  .sheet .vprev { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 12px; max-height: 45vh; overflow: auto; font-size: 15px; }
  .sheet .vprev p, .sheet .vprev ul { margin: 0 0 6px; }

  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(88px + env(safe-area-inset-bottom)); z-index: 60;
    display: flex; align-items: center; gap: 12px; padding: 8px 8px 8px 16px; border-radius: 12px; background: var(--ink); color: var(--paper);
    box-shadow: var(--shadow); max-width: calc(100% - 32px); font-size: 15px; }
  .toast button { background: transparent; color: var(--paper); border-color: transparent; font-weight: 600; }
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">

  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>

  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M9 3h6l-1 5 3.5 3.5v1.5h-11v-1.5L10 8 9 3zM12 13v8"/></symbol>
  <symbol id="i-pin-fill" viewBox="0 0 24 24"><path d="M9 3h6l-1 5 3.5 3.5v1.5h-11v-1.5L10 8 9 3z" fill="currentColor"/><path d="M12 13v8"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 6L4 11l5 5"/><path d="M4 11h10a5 5 0 010 10h-3"/></symbol>
  <symbol id="i-redo" viewBox="0 0 24 24"><path d="M15 6l5 5-5 5"/><path d="M20 11H10a5 5 0 000 10h3"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4" fill="currentColor"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/><circle cx="19" cy="12" r="1.4" fill="currentColor"/></symbol>
  <symbol id="i-type" viewBox="0 0 24 24"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></symbol>
  <symbol id="i-pen" viewBox="0 0 24 24"><path d="M15.5 4.5l4 4L8 20H4v-4L15.5 4.5z"/></symbol>
  <symbol id="i-hl" viewBox="0 0 24 24"><path d="M14 4l6 6-8 8H6v-6l8-8zM4 21h16"/></symbol>
  <symbol id="i-eraser" viewBox="0 0 24 24"><path d="M8 20h12M5.5 15.5l9-9 5 5-8.5 8.5H9z"/></symbol>
  <symbol id="i-move" viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"/></symbol>
  <symbol id="i-label" viewBox="0 0 24 24"><path d="M3 12V4h8l10 10-8 8L3 12z"/><circle cx="7.5" cy="8.5" r="1.2"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 00-1-1H5a1 1 0 00-1 1v10a1 1 0 001 1h3"/></symbol>
  <symbol id="i-history" viewBox="0 0 24 24"><path d="M3 12a9 9 0 103-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
  <symbol id="i-chevd" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
  <symbol id="i-notes" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="9" rx="1.5"/><rect x="13" y="4" width="7" height="6" rx="1.5"/><rect x="4" y="15" width="7" height="5" rx="1.5"/><rect x="13" y="12" width="7" height="8" rx="1.5"/></symbol>
</svg>

<!-- ============ Home: notes grid ============ -->
<section id="listView">
  <header class="bar">
    <button id="drawerBtn" class="icon" type="button" aria-label="Folders"><svg class="i"><use href="#i-menu"/></svg></button>
    <h1 id="folderTitle">All notes</h1>
    <button id="syncPill" class="pill" type="button" aria-live="polite"></button>
  </header>
  <main>
    <div class="searchwrap">
      <svg class="i"><use href="#i-search"/></svg>
      <input id="q" type="search" placeholder="Search notes" autocomplete="off" aria-label="Search notes" enterkeyhint="search">
      <div id="recent" class="recent hidden"></div>
    </div>
    <div class="chips" id="scopeChips"></div>
    <div class="chips" id="labelChips"></div>
    <div class="crumbs" id="crumbs"></div>
    <div id="results" class="results hidden"></div>
    <div id="browse">
      <div id="subfolders" class="folders"></div>
      <div id="pinnedHead" class="section-head hidden">Pinned</div>
      <div id="pinned" class="grid"></div>
      <div id="othersHead" class="section-head hidden">Others</div>
      <div id="others" class="grid"></div>
      <p id="emptyMsg" class="empty hidden"></p>
    </div>
  </main>
  <footer id="footer">
    <span id="versionLabel"></span>
    <button id="checkUpdateBtn" type="button">Check for update</button>
    <a href="import.html" style="color:var(--accent)">Import from Google Keep</a>
    <span id="demoTools" class="hidden">
      <button id="demoOffline" type="button" aria-pressed="false">Pretend offline</button>
      <button id="demoElsewhere" type="button">Pretend the laptop edited the last note</button>
    </span>
  </footer>
  <button id="newFab" class="fab primary" type="button" aria-label="New note"><svg class="i"><use href="#i-plus"/></svg></button>
</section>

<div id="drawerBack" class="drawer-back hidden"></div>
<nav id="drawer" class="drawer hidden" aria-label="Folders">
  <h2>Folders</h2>
  <div id="tree"></div>
  <button id="addRootFolder" class="add" type="button">+ New folder</button>
</nav>

<!-- ============ A note ============ -->
<section id="editorView" class="hidden">
  <header class="bar">
    <button id="backBtn" class="icon" type="button" aria-label="Back to notes"><svg class="i"><use href="#i-back"/></svg></button>
    <span class="spacer"></span>
    <button id="syncPill2" class="pill" type="button"></button>
    <button id="undoBtn" class="icon" type="button" aria-label="Undo" disabled><svg class="i"><use href="#i-undo"/></svg></button>
    <button id="redoBtn" class="icon" type="button" aria-label="Redo" disabled><svg class="i"><use href="#i-redo"/></svg></button>
    <button id="pinBtn" class="icon" type="button" aria-label="Pin note" aria-pressed="false"><svg class="i"><use href="#i-pin"/></svg></button>
  </header>
  <div class="tools" id="tools">
    <button class="tool" type="button" data-tool="type" aria-pressed="true"><svg class="i"><use href="#i-type"/></svg>Type</button>
    <button class="tool" type="button" data-tool="pen" aria-pressed="false"><svg class="i"><use href="#i-pen"/></svg>Pen</button>
    <button class="tool" type="button" data-tool="highlighter" aria-pressed="false"><svg class="i"><use href="#i-hl"/></svg>Highlight</button>
    <button class="tool" type="button" data-tool="eraser" aria-pressed="false"><svg class="i"><use href="#i-eraser"/></svg>Erase</button>
    <button class="tool" type="button" data-tool="select" aria-pressed="false"><svg class="i"><use href="#i-move"/></svg>Move</button>
    <span id="penOpts" style="display:contents"></span>
  </div>
  <div id="conflict" class="notice hidden">
    <b>This note was changed on another device.</b>
    <span id="conflictText">Your version is kept here and hasn't been saved over the other one.</span>
    <div class="row">
      <button id="keepBoth" type="button" class="primary">Keep both</button>
      <button id="useTheirs" type="button">Use the other version</button>
      <button id="useMine" type="button">Save mine over it</button>
    </div>
  </div>
  <div id="canvasWrap">
    <div id="noteHead">
      <input id="noteTitle" type="text" placeholder="Title" autocomplete="off" autocapitalize="sentences" aria-label="Title" style="border:0;padding:4px 0;background:transparent">
      <div id="noteMeta"></div>
      <div id="noteLabels"></div>
    </div>
    <div id="canvasHost"></div>
  </div>
  <button id="menuFab" class="fab" type="button" aria-label="Note options" aria-expanded="false"><svg class="i"><use href="#i-more"/></svg></button>
  <div id="noteMenu" class="hidden" role="menu">
    <button type="button" data-m="labels"><svg class="i"><use href="#i-label"/></svg>Labels</button>
    <button type="button" data-m="move"><svg class="i"><use href="#i-folder"/></svg>Move to folder</button>
    <button type="button" data-m="copy"><svg class="i"><use href="#i-copy"/></svg>Make a copy</button>
    <button type="button" data-m="history"><svg class="i"><use href="#i-history"/></svg>Version history</button>
    <div class="space"><span>Add space</span>
      <button type="button" data-space="left" aria-label="Add space on the left">←</button>
      <button type="button" data-space="up" aria-label="Add space at the top">↑</button>
      <button type="button" data-space="right" aria-label="Add a text box on the right">→</button>
      <button type="button" data-space="down" aria-label="Add a text box below">↓</button>
    </div>
    <hr>
    <button type="button" data-m="delete" class="danger"><svg class="i"><use href="#i-trash"/></svg>Delete note</button>
  </div>
  <div id="fmtBar" class="hidden" role="toolbar" aria-label="Formatting">
    <button type="button" data-f="bold" aria-label="Bold"><b>B</b></button>
    <button type="button" data-f="italic" aria-label="Italic"><i style="font-family:Georgia,serif">I</i></button>
    <button type="button" data-f="underline" aria-label="Underline"><u>U</u></button>
    <button type="button" data-f="strike" aria-label="Strikethrough"><s>S</s></button>
    <button type="button" data-f="highlight" aria-label="Highlight"><span class="dot" style="background:#fde68a"></span></button>
    <button type="button" data-f="color" aria-label="Text colour"><span style="font-weight:700;border-bottom:3px solid #c0392b">A</span></button>
    <button type="button" data-f="size" aria-label="Text size">A<small>a</small></button>
    <span class="sep"></span>
    <button type="button" data-f="h1" aria-label="Heading">H1</button>
    <button type="button" data-f="h2" aria-label="Subheading">H2</button>
    <button type="button" data-f="bullet" aria-label="Bulleted list">•≡</button>
    <button type="button" data-f="ordered" aria-label="Numbered list">1.</button>
    <button type="button" data-f="task" aria-label="Checklist">☑</button>
    <button type="button" data-f="quote" aria-label="Quote">❝</button>
    <span class="sep"></span>
    <button type="button" data-f="left" aria-label="Align left">⇤</button>
    <button type="button" data-f="center" aria-label="Centre">↔</button>
    <button type="button" data-f="right" aria-label="Align right">⇥</button>
    <button type="button" data-f="link" aria-label="Link">Link</button>
    <button type="button" data-f="clear" aria-label="Clear formatting">Clear</button>
  </div>
  <div id="pop" class="pop hidden"></div>
</section>

<div id="sheetBack" class="sheet-back hidden"><div class="sheet" role="dialog" aria-modal="true" id="sheet"></div></div>
<div id="toast" class="toast hidden" role="status"><span id="toastText"></span><button id="toastBtn" type="button"></button></div>
<div id="updateBar" class="toast hidden" role="status"><span>A new version is ready.</span><button id="applyUpdateBtn" type="button">Update now</button></div>

<script src="config.js"></script>
<script src="demo-data.js"></script>
<script src="drive.js"></script>
<script src="vendor.js"></script>
<script src="notes.js"></script>
<script src="canvas.js"></script>
<script src="search.js"></script>
<script src="app.js"></script>
</body>
</html>
