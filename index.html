<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Quick Notes</title>
<meta name="theme-color" content="#f6f3ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17161a" media="(prefers-color-scheme: dark)">
<meta name="description" content="Quick notes saved as Markdown files in Google Drive.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  /* One column. Two views: a note (opens first) and the list of notes. System fonts only, so it opens fast. */
  :root {
    --paper: #f6f3ec;
    --surface: #ffffff;
    --ink: #22201c;
    --muted: #6d675d;
    --rule: #e2ddd2;
    --accent: #8a5a12;
    --accent-soft: #f3e6cf;
    --accent-ink: #ffffff;
    --warn-bg: #fbefd5;
    --warn-ink: #5e4300;
    --bad: #a33a2b;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --radius: 12px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #17161a; --surface: #211f24; --ink: #ebe7df; --muted: #a39d93; --rule: #34313a;
      --accent: #e9b25e; --accent-soft: #3a2f1d; --accent-ink: #1d1404; --warn-bg: #3a3017; --warn-ink: #f3dc9a; --bad: #f08a7a;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { background: var(--paper); color: var(--ink); font: 16px/1.5 var(--font);
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    -webkit-tap-highlight-color: transparent; }

  .bar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; background: var(--paper); border-bottom: 1px solid transparent; }
  .bar.scrolled { border-bottom-color: var(--rule); }
  .bar h1 { flex: 1; min-width: 0; white-space: nowrap; margin: 0 0 0 4px; font: 600 19px/1.2 var(--font); letter-spacing: -.01em; }
  .bar .spacer { flex: 1; }

  button { font: 500 15px/1 var(--font); color: var(--ink); background: var(--surface);
    border: 1px solid var(--rule); border-radius: 10px; padding: 10px 13px; cursor: pointer; min-height: 40px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  button.ghost { background: transparent; border-color: transparent; }
  button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
  button:disabled { opacity: .5; cursor: default; }
  button:focus-visible, input:focus-visible, textarea:focus-visible, .card:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px; }

  .pill { font-size: 13px; padding: 7px 11px; min-height: 34px; border-radius: 999px; color: var(--muted); white-space: nowrap; }
  .pill.waiting { color: var(--warn-ink); background: var(--warn-bg); border-color: transparent; }
  .pill.bad { color: var(--bad); }
  .pill .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: currentColor; margin-right: 6px; vertical-align: 1px; }

  main { max-width: 820px; margin: 0 auto; padding: 4px 16px 96px; }

  .notice { border-radius: var(--radius); padding: 12px 14px; margin: 8px 0 12px; background: var(--warn-bg); color: var(--warn-ink); font-size: 15px; }
  .notice b { display: block; margin-bottom: 4px; }
  .notice .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }

  /* The note */
  #noteTitle { display: block; width: 100%; border: 0; outline: 0; background: transparent; color: var(--ink);
    font: 600 22px/1.3 var(--font); padding: 10px 0 4px; }
  #noteBody { display: block; width: 100%; min-height: 30vh; border: 0; outline: 0; resize: none; overflow: hidden;
    background: transparent; color: var(--ink); font: 17px/1.55 var(--font); padding: 6px 0 12px; }
  ::placeholder { color: var(--muted); opacity: .8; }

  .items { list-style: none; margin: 4px 0; padding: 0; }
  .items li { display: flex; align-items: flex-start; gap: 10px; padding: 2px 0; }
  .items input[type=checkbox] { flex: none; width: 22px; height: 22px; margin: 7px 0 0; accent-color: var(--accent); }
  .items textarea { flex: 1; min-width: 0; border: 0; outline: 0; resize: none; overflow: hidden; background: transparent;
    color: var(--ink); font: 17px/1.5 var(--font); padding: 5px 0; height: 36px; }
  .items li.done textarea { text-decoration: line-through; color: var(--muted); }
  .items .remove { flex: none; min-height: 34px; padding: 6px 10px; color: var(--muted); }
  #addItem { margin: 4px 0 0 30px; color: var(--muted); }
  #doneHead { font-size: 13px; color: var(--muted); margin: 14px 0 2px 32px; }

  .labels { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 14px 0 6px; }
  .chip { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; line-height: 1; padding: 6px 10px; border-radius: 999px;
    background: var(--accent-soft); color: var(--ink); border: 1px solid transparent; min-height: 30px; }
  .chip button { min-height: 0; padding: 0 2px; border: 0; background: transparent; color: var(--muted); font-size: 15px; }
  #labelInput { font: 14px var(--font); color: var(--ink); background: transparent; border: 1px dashed var(--rule);
    border-radius: 999px; padding: 6px 12px; width: 130px; }
  .meta { font-size: 13px; color: var(--muted); margin: 10px 0 0; }

  .toolbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; gap: 6px; justify-content: center;
    padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); background: var(--paper); border-top: 1px solid var(--rule); }
  .toolbar button { flex: 0 1 140px; }

  /* The list */
  .search { display: block; width: 100%; font: 16px var(--font); color: var(--ink); background: var(--surface);
    border: 1px solid var(--rule); border-radius: 999px; padding: 11px 16px; margin: 6px 0 10px; }
  .filters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 8px; scrollbar-width: none; }
  .filters button { flex: none; font-size: 14px; min-height: 34px; padding: 7px 12px; border-radius: 999px; }
  .section-head { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 16px 4px 8px; }
  .grid { columns: 2 170px; column-gap: 10px; }
  .card { break-inside: avoid; margin: 0 0 10px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--rule);
    border-radius: var(--radius); cursor: pointer; overflow-wrap: anywhere; }
  .card h3 { margin: 0 0 4px; font: 600 16px/1.3 var(--font); }
  .card .text { margin: 0; font-size: 15px; white-space: pre-wrap; display: -webkit-box; -webkit-line-clamp: 8; -webkit-box-orient: vertical; overflow: hidden; }
  .card ul { list-style: none; margin: 0; padding: 0; font-size: 15px; }
  .card li { display: flex; gap: 8px; align-items: flex-start; padding: 2px 0; }
  .card li input { margin: 3px 0 0; width: 18px; height: 18px; flex: none; accent-color: var(--accent); }
  .card li.done span { text-decoration: line-through; color: var(--muted); }
  .card .more { font-size: 13px; color: var(--muted); padding-top: 2px; }
  .card .foot { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; align-items: center; }
  .card .foot .chip { font-size: 12px; padding: 4px 8px; min-height: 0; }
  .card .flag { font-size: 12px; color: var(--warn-ink); background: var(--warn-bg); border-radius: 999px; padding: 3px 8px; }
  .empty { color: var(--muted); padding: 24px 4px; }

  /* Sync details sheet */
  .sheet-back { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.35); display: flex; align-items: flex-end; justify-content: center; }
  .sheet { width: 100%; max-width: 560px; max-height: 80vh; overflow: auto; background: var(--paper); border-radius: 18px 18px 0 0;
    padding: 18px 18px calc(18px + env(safe-area-inset-bottom)); }
  .sheet h2 { margin: 0 0 6px; font: 600 18px/1.3 var(--font); }
  .sheet p { margin: 0 0 12px; color: var(--muted); font-size: 15px; }
  .sheet ul { margin: 0 0 14px; padding-left: 18px; font-size: 15px; }
  .sheet .row { display: flex; flex-wrap: wrap; gap: 8px; }

  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom)); z-index: 40;
    display: flex; align-items: center; gap: 12px; padding: 8px 8px 8px 16px; border-radius: 12px; background: var(--ink); color: var(--paper);
    box-shadow: 0 6px 24px rgba(0,0,0,.25); max-width: calc(100% - 32px); font-size: 15px; }
  .toast button { background: transparent; color: var(--paper); border-color: transparent; font-weight: 600; }

  footer { max-width: 820px; margin: 0 auto; padding: 0 16px 90px; font-size: 12px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  footer button { font-size: 12px; padding: 6px 9px; min-height: 0; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<header class="bar" id="bar">
  <button id="backBtn" class="ghost hidden" type="button">← Notes</button>
  <h1 id="appTitle" class="hidden">Quick Notes</h1>
  <span class="spacer" id="barSpacer"></span>
  <button id="syncPill" class="pill" type="button" aria-live="polite"></button>
  <button id="pinBtn" class="hidden" type="button" aria-pressed="false" aria-label="Pin note">Pin</button>
  <button id="newBtn" class="primary hidden" type="button">+ New</button>
</header>

<main>
  <div id="banner" class="notice hidden" role="alert"></div>

  <section id="editorView" class="hidden">
    <div id="conflict" class="notice hidden">
      <b>This note was changed on another device.</b>
      <span id="conflictText">Your version is kept here and hasn't been saved over the other one.</span>
      <div class="row">
        <button id="keepBoth" type="button" class="primary">Keep both</button>
        <button id="useTheirs" type="button">Use the other version</button>
        <button id="useMine" type="button">Save mine over it</button>
      </div>
    </div>
    <input id="noteTitle" placeholder="Title" autocomplete="off" autocapitalize="sentences" aria-label="Title">
    <textarea id="noteBody" placeholder="Note" spellcheck="true" autocapitalize="sentences" aria-label="Note"></textarea>
    <div id="checklist" class="hidden">
      <ul class="items" id="todoItems"></ul>
      <button id="addItem" class="ghost" type="button">+ List item</button>
      <div id="doneHead" class="hidden"></div>
      <ul class="items" id="doneItems"></ul>
    </div>
    <div class="labels" id="labelRow">
      <span id="labelChips" style="display:contents"></span>
      <input id="labelInput" list="labelList" placeholder="+ Label" autocomplete="off" autocapitalize="none" aria-label="Add a label">
      <datalist id="labelList"></datalist>
    </div>
    <p class="meta" id="noteMeta"></p>
  </section>

  <section id="listView" class="hidden">
    <input id="q" class="search" type="search" placeholder="Search notes" autocomplete="off" aria-label="Search notes">
    <div class="filters" id="filters"></div>
    <div id="pinnedHead" class="section-head hidden">Pinned</div>
    <div id="pinned" class="grid"></div>
    <div id="othersHead" class="section-head hidden">Others</div>
    <div id="others" class="grid"></div>
    <p id="emptyMsg" class="empty hidden"></p>
  </section>
</main>

<nav class="toolbar hidden" id="toolbar">
  <button id="listBtn" type="button" aria-pressed="false">Checklist</button>
  <button id="labelBtn" type="button">Label</button>
  <button id="deleteBtn" type="button">Delete</button>
</nav>

<footer id="footer">
  <span id="versionLabel"></span>
  <button id="checkUpdateBtn" type="button">Check for update</button>
  <span id="demoTools" class="hidden">
    <button id="demoOffline" type="button" aria-pressed="false">Pretend offline</button>
    <button id="demoElsewhere" type="button">Pretend the laptop edited the last note</button>
  </span>
</footer>

<div id="sheetBack" class="sheet-back hidden">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h2 id="sheetTitle">Sync</h2>
    <p id="sheetText"></p>
    <ul id="sheetList"></ul>
    <div class="row">
      <button id="sheetSignIn" class="primary hidden" type="button">Sign in with Google</button>
      <button id="sheetSync" type="button">Sync now</button>
      <button id="sheetClose" type="button">Close</button>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden" role="status"><span id="toastText"></span><button id="toastBtn" type="button"></button></div>

<div id="updateBar" class="toast hidden" role="status">
  <span>A new version is ready.</span>
  <button id="applyUpdateBtn" type="button">Update now</button>
</div>

<script src="config.js"></script>
<script src="demo-data.js"></script>
<script src="drive.js"></script>
<script src="notes.js"></script>
<script src="app.js"></script>
</body>
</html>
