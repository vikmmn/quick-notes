<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Quick Notes</title>
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1f1f1f" media="(prefers-color-scheme: dark)">
<meta name="description" content="Quick notes saved as Markdown files in Google Drive.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  /* Two views: the notes grid (opens first) and a note's canvas. System fonts only, so it opens fast. */
  :root {
    --paper: #ffffff; --surface: #ffffff; --field: #f0f4f4; --ink: #1f1f1f; --muted: #5f6368; --rule: #e0e3e7;
    --accent: #00796b; --accent-soft: #d8efec; --accent-ink: #ffffff;
    --warn-bg: #fef7e0; --warn-ink: #6b4a00; --bad: #b3261e; --mark: #fde68a;
    --font: "Google Sans", Roboto, system-ui, -apple-system, "Segoe UI", "Helvetica Neue", sans-serif;
    --radius: 12px; --shadow: 0 1px 3px rgba(60,64,67,.3), 0 4px 8px 3px rgba(60,64,67,.15);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #1f1f1f; --surface: #1f1f1f; --field: #2d3131; --ink: #e3e3e3; --muted: #a8adb3; --rule: #444746;
      --accent: #5fc4b5; --accent-soft: #1f3a37; --accent-ink: #00201c; --warn-bg: #3d3214; --warn-ink: #f6dd9a; --bad: #f2b8b5; --mark: #6b5414;
      --shadow: 0 1px 3px rgba(0,0,0,.6), 0 4px 8px 3px rgba(0,0,0,.35);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--paper); color: var(--ink); font: 16px/1.5 var(--font); -webkit-tap-highlight-color: transparent;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  .hidden { display: none !important; }
  svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; display: block; }

  button { font: 500 15px/1 var(--font); color: var(--accent); background: var(--surface); border: 1px solid var(--rule);
    border-radius: 999px; padding: 10px 16px; cursor: pointer; min-height: 40px; letter-spacing: .01em; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  button.ghost { background: transparent; border-color: transparent; }
  button.icon { padding: 0; width: 44px; height: 44px; display: inline-grid; place-items: center; background: transparent; border-color: transparent; color: var(--muted); border-radius: 50%; }
  button.icon:hover { background: var(--field); }
  button.cloud.ok, button.cloud.busy, button.cloud.offline { color: var(--muted); }
  button.cloud.attention { color: #e37400; }
  button.cloud.busy svg { animation: qn-pulse 1.6s ease-in-out infinite; }
  @keyframes qn-pulse { 50% { opacity: .45; } }
  button.icon[aria-pressed="true"], button.tool[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
  button:disabled { opacity: .4; cursor: default; }
  button.danger { color: var(--bad); }
  button:focus-visible, input:focus-visible, .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input[type=text], input[type=search] { font: 16px var(--font); color: var(--ink); background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 10px 12px; width: 100%; }

  .bar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 2px; padding: 6px 6px; background: var(--paper); }
  .bar h1 { flex: 1; min-width: 0; margin: 0 6px; font: 400 22px/1.2 var(--font); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar .spacer { flex: 1; }
  .pill { font-size: 13px; padding: 7px 11px; min-height: 34px; border-radius: 999px; color: var(--muted); white-space: nowrap; }
  .pill.waiting { color: var(--warn-ink); background: var(--warn-bg); border-color: transparent; }
  .pill.bad { color: var(--bad); }
  .pill .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: currentColor; margin-right: 6px; vertical-align: 1px; }

  .notice { border-radius: var(--radius); padding: 12px 14px; margin: 8px 12px; background: var(--warn-bg); color: var(--warn-ink); font-size: 15px; }
  #syncBanner { display: flex; align-items: center; gap: 10px; max-width: 1072px; margin: 4px auto 8px; }
  #syncBanner:not(.hidden) { margin-left: max(14px, calc(50% - 536px)); margin-right: max(14px, calc(50% - 536px)); }
  #syncBanner span { flex: 1; }
  #syncBanner button { flex: none; background: transparent; border-color: currentColor; color: inherit; }
  .notice b { display: block; margin-bottom: 4px; }
  .notice .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }

  /* ---------- Home: notes grid ---------- */
  #listView main { max-width: 1100px; margin: 0 auto; padding: 0 14px 110px; }
  .searchwrap { position: relative; margin: 2px 0 10px; }
  .searchwrap input { border-radius: 999px; padding: 13px 16px 13px 46px; background: var(--field); border-color: transparent; }
  .searchwrap input:focus { background: var(--surface); border-color: var(--rule); box-shadow: var(--shadow); outline: 0; }
  .searchwrap svg.i { position: absolute; left: 16px; top: 14px; color: var(--muted); }
  .recent { position: absolute; left: 0; right: 0; top: 48px; z-index: 15; background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; box-shadow: var(--shadow); padding: 6px; }
  .recent div { display: flex; align-items: center; gap: 8px; padding: 9px 10px; border-radius: 8px; cursor: pointer; }
  .recent div:hover { background: var(--paper); }
  .recent div span { flex: 1; }
  .recent button { min-height: 0; padding: 2px 6px; border: 0; background: transparent; color: var(--muted); }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 6px; scrollbar-width: none; }
  .chips:empty { display: none; }
  .chips button { flex: none; font-size: 14px; min-height: 34px; padding: 7px 14px; border-radius: 8px; color: var(--ink); }
  .chips button[aria-pressed="true"] { background: var(--accent-soft); border-color: transparent; color: var(--ink); }
  .crumbs { font-size: 13px; color: var(--muted); margin: 0 2px 8px; }
  .crumbs:empty { display: none; }
  .crumbs a { color: var(--accent); cursor: pointer; text-decoration: none; }
  .folders { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-bottom: 6px; }
  .folder { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border: 1px solid var(--rule); border-radius: 12px; background: var(--surface); cursor: pointer; font-size: 15px; min-width: 0; }
  .folder:hover { background: var(--field); }
  .folder span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .folder small { color: var(--muted); }
  .folder svg.i { color: var(--accent); flex: none; }
  .section-head { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 16px 4px 8px; }
  .grid { columns: 2 170px; column-gap: 10px; }
  .card { position: relative; break-inside: avoid; margin: 0 0 10px; padding: 12px 16px; background: var(--surface); border: 1px solid var(--rule);
    border-radius: var(--radius); cursor: pointer; overflow-wrap: anywhere; transition: box-shadow .15s; }
  .card:hover { box-shadow: var(--shadow); }
  .card h3 { margin: 0 0 4px; font: 500 16px/1.35 var(--font); padding-right: 18px; }
  .card .pin { position: absolute; top: 10px; right: 10px; color: var(--accent); }
  .card .pin svg.i { width: 16px; height: 16px; }
  .card .prev { font-size: 15px; max-height: 280px; overflow: hidden; }
  .card .prev.long { -webkit-mask-image: linear-gradient(#000 80%, transparent); mask-image: linear-gradient(#000 80%, transparent); }
  .card .prev p, .card .prev ul, .card .prev ol, .card .prev h1, .card .prev h2, .card .prev h3, .card .prev blockquote { margin: 0 0 6px; }
  .card .prev h1, .card .prev h2, .card .prev h3 { font-size: 16px; }
  .card .prev ul, .card .prev ol { padding-left: 20px; }
  .card .prev li.task { list-style: none; margin-left: -20px; display: flex; gap: 8px; align-items: flex-start; }
  .card .prev li.task input { margin: 4px 0 0; width: 17px; height: 17px; flex: none; accent-color: var(--accent); }
  .card .prev li.task.done { color: var(--muted); text-decoration: line-through; }
  img.qn-img { max-width: 100%; height: auto; border-radius: 8px; display: block; margin: 4px 0; }
  img.qn-img.pending { min-height: 48px; min-width: 80px; background: var(--accent-soft); }
  .card .prev img.qn-img { max-height: 220px; object-fit: cover; }
  .card .ink-thumb { display: block; max-width: 100%; height: auto; margin-top: 6px; }
  .card .foot { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; align-items: center; }
  .chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; line-height: 1; padding: 5px 9px; border-radius: 999px; background: var(--field); color: var(--ink); }
  .chip button { min-height: 0; padding: 0 2px; border: 0; background: transparent; color: var(--muted); font-size: 15px; }
  .flag { font-size: 12px; color: var(--warn-ink); background: var(--warn-bg); border-radius: 999px; padding: 3px 8px; }
  .where { font-size: 12px; color: var(--muted); }
  .results .card { margin-bottom: 8px; }
  .results .snip { font-size: 14px; color: var(--muted); margin-top: 4px; }
  mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }
  .empty { color: var(--muted); padding: 24px 4px; }
  .fab { position: fixed; z-index: 25; width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; padding: 0; color: var(--ink);
    box-shadow: var(--shadow); bottom: calc(18px + env(safe-area-inset-bottom)); }
  .fab svg.i { width: 26px; height: 26px; }
  #newFab { right: 18px; }
  button.fab.primary { background: var(--accent-soft); border-color: transparent; color: var(--ink); }
  .set { padding: 12px 0; border-bottom: 1px solid var(--rule); }
  .set b { display: block; font-weight: 500; margin-bottom: 2px; }
  .set p { margin: 0 0 10px !important; }
  footer { max-width: 1100px; margin: 0 auto; padding: 24px 14px 100px; font-size: 12px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  footer button { font-size: 12px; padding: 6px 9px; min-height: 0; }

  /* Folders drawer */
  .drawer-back { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.35); }
  .drawer { position: fixed; z-index: 41; top: 0; bottom: 0; left: 0; width: min(330px, 86vw); background: var(--paper); box-shadow: var(--shadow);
    padding: calc(12px + env(safe-area-inset-top)) 10px calc(12px + env(safe-area-inset-bottom)); overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
  .drawer h2 { font: 500 18px/1.3 var(--font); margin: 4px 12px 10px; }
  .tree-row { display: flex; align-items: center; gap: 2px; border-radius: 0 999px 999px 0; min-height: 46px; padding-right: 2px; }
  .tree-row.on { background: var(--accent-soft); }
  .tree-row .tw { width: 28px; height: 32px; min-height: 0; padding: 0; border: 0; background: transparent; color: var(--muted); flex: none; display: grid; place-items: center; }
  .tree-row .tw svg.i { width: 16px; height: 16px; }
  .tree-row .nm { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; padding: 8px 4px; cursor: pointer; }
  .tree-row .nm svg.i { color: var(--accent); flex: none; }
  .tree-row .nm span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tree-row .nm small { color: var(--muted); margin-left: auto; }
  .tree-row .more { width: 34px; height: 34px; min-height: 0; padding: 0; border: 0; background: transparent; color: var(--muted); flex: none; display: grid; place-items: center; }
  .drawer .add { margin: 6px 8px 0; text-align: left; justify-content: flex-start; }

  /* ---------- A note ---------- */
  #editorView { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--paper);
    padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); }
  #editorView .bar { position: static; }
  /* Drawing tools: the tools in one row, the chosen tool's settings in a second row under it */
  .tools { display: flex; flex-direction: column; border-bottom: 1px solid var(--rule); flex: none; }
  .tool-row { display: flex; gap: 2px; padding: 0 4px 2px; }
  .tools .tool { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; min-height: 48px;
    border-color: transparent; background: transparent; font-size: 11.5px; color: var(--ink); border-radius: 12px; white-space: nowrap; }
  .tools .tool svg.i { width: 21px; height: 21px; }
  .tool-opts { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 4px; padding: 6px 10px 8px; border-top: 1px solid var(--rule); background: var(--field); }
  .tool-opts:empty { display: none; }
  .tool-opts .grp { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; width: 100%; }
  .tool-opts .grp.half { width: auto; flex: 1 1 160px; }
  .tool-opts .swatch { width: 26px; height: 26px; margin: 0; }
  .tool-opts .ochip { background: var(--surface) !important; }
  .tool-opts .ochip[aria-pressed="true"] { background: var(--accent-soft) !important; }
  .tool-opts .oslider { flex: 1 1 140px; padding: 0 2px; }
  .tool-opts .oslider input[type=range] { flex: 1; width: auto; min-width: 70px; }
  .tool-opts .where { white-space: normal !important; padding: 0 2px !important; }
  .tools .sep { display: none; }
  .dhead { display: flex; align-items: center; gap: 10px; margin: 4px 12px 12px; font-size: 18px; }
  .dhead b { font-weight: 500; }
  .dhead img { border-radius: 8px; }
  .dsec { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 18px 12px 6px; }
  #labelTree .tree-row .nm svg.i { color: var(--muted); }
  .chips .clear { color: var(--accent); }
  .wn { position: fixed; inset: 0; z-index: 70; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; padding: 16px; touch-action: pan-y; }
  .wn-card { width: 100%; max-width: 420px; background: var(--surface); border-radius: 28px; padding: 18px 20px 16px; box-shadow: var(--shadow); overflow: hidden; }
  .wn-top { display: flex; align-items: center; justify-content: space-between; }
  .wn-kicker { font-size: 13px; color: var(--accent); font-weight: 500; }
  .wn-skip { border: 0; background: transparent; color: var(--muted); min-height: 32px; padding: 4px 8px; }
  .wn-slide { text-align: center; padding: 8px 4px 4px; animation: wn-in .28s ease-out; }
  .wn-slide.from-right { animation-name: wn-r; } .wn-slide.from-left { animation-name: wn-l; }
  @keyframes wn-in { from { opacity: 0; transform: translateY(8px); } }
  @keyframes wn-r { from { opacity: 0; transform: translateX(40px); } }
  @keyframes wn-l { from { opacity: 0; transform: translateX(-40px); } }
  .wn-art { width: 100%; max-width: 300px; height: auto; margin: 8px auto 4px; display: block; background: var(--field); border-radius: 20px; }
  .wn-slide h2 { font: 400 22px/1.3 var(--font); margin: 12px 0 6px; }
  .wn-slide p { color: var(--muted); font-size: 15px; margin: 0; min-height: 66px; }
  .wn-foot { display: flex; align-items: center; gap: 8px; margin-top: 16px; }
  .wn-dots { flex: 1; display: flex; gap: 6px; }
  .wn-dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--rule); }
  .wn-dots i.on { background: var(--accent); width: 18px; border-radius: 4px; }
  .dflt { font-style: normal; font-size: 11px; color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 1px 6px; flex: none; }
  .swatch { width: 26px; height: 26px; min-height: 0; padding: 0; border-radius: 50%; border: 2px solid var(--rule); flex: none; margin: 0 2px; }
  .swatch[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--paper) inset; }
  .size { width: 32px; height: 32px; min-height: 0; padding: 0; display: inline-grid; place-items: center; border-color: transparent; background: transparent; flex: none; }
  .size i { display: block; border-radius: 50%; background: var(--ink); }
  .size[aria-pressed="true"] { background: var(--accent-soft); }
  /* A note is an endless page: the head stays put, the page underneath moves, zooms and turns */
  #canvasWrap { flex: 1; min-height: 0; overflow: hidden; position: relative; display: flex; flex-direction: column; }
  #noteHead { padding: 8px 16px 4px; flex: none; }
  #canvasHost { flex: 1; min-height: 0; position: relative; overflow: hidden; touch-action: none; overscroll-behavior: contain; }
  #canvasHost.picking { cursor: zoom-in; }
  .qn-nav { position: absolute; right: 12px; bottom: 84px; width: 168px; height: 124px; z-index: 8; background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; touch-action: none; cursor: pointer; }
  .qn-nav svg { width: 100%; height: 100%; display: block; }
  .qn-area { position: absolute; z-index: 9; border: 2px dashed var(--accent); background: rgba(0,121,107,.08); border-radius: 6px; pointer-events: none; }
  #viewCtl { position: fixed; right: 16px; z-index: 25; bottom: calc(22px + env(safe-area-inset-bottom)); display: flex; gap: 8px; align-items: center; }
  #viewCtl.lift { bottom: calc(70px + env(safe-area-inset-bottom)); }
  #viewCtl button { min-height: 40px; height: 40px; padding: 0 14px; border-radius: 20px; background: var(--surface); box-shadow: var(--shadow); border-color: transparent; color: var(--ink); font-size: 14px; }
  #viewCtl #compass { width: 40px; padding: 0; display: grid; place-items: center; }
  #viewCtl #compass svg { transition: transform .1s; }
  #viewMenu { position: fixed; right: 16px; z-index: 36; bottom: calc(72px + env(safe-area-inset-bottom)); min-width: 230px; background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; box-shadow: var(--shadow); padding: 6px; }
  #viewMenu.lift { bottom: calc(120px + env(safe-area-inset-bottom)); }
  #viewMenu button { display: flex; width: 100%; justify-content: space-between; border: 0; background: transparent; padding: 12px; text-align: left; font-size: 15px; color: var(--ink); border-radius: 10px; }
  #viewMenu button:hover { background: var(--field); }
  #viewMenu hr { border: 0; border-top: 1px solid var(--rule); margin: 4px 0; }
  #viewMenu .zrow { display: flex; gap: 4px; padding: 2px 4px 6px; }
  #viewMenu .zrow button { justify-content: center; background: var(--field); font-size: 18px; padding: 8px; }
  #noteTitle { display: block; width: 100%; outline: 0; color: var(--ink); font: 400 22px/1.3 var(--font); }
  #noteMeta { font-size: 12px; color: var(--muted); }
  #noteLabels { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  #noteLabels:empty { display: none; }
  ::placeholder { color: var(--muted); opacity: .8; }

  .stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; touch-action: none; }
  .ink-layer { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }
  .box { position: absolute; min-height: 32px; border-radius: 6px; touch-action: none; }
  .box.focused { box-shadow: 0 0 0 1px var(--rule); }
  .stage[data-tool=pen] .box, .stage[data-tool=erase] .box, .stage[data-tool=lasso] .box, .stage[data-tool=nudge] .box, .stage[data-tool=fill] .box { pointer-events: none; }
  .ink-ui { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; z-index: 3; }
  .inkbar { position: absolute; z-index: 7; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; max-width: min(92vw, 520px); padding: 6px; background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); }
  .inkbar button { min-height: 34px; padding: 6px 12px; font-size: 14px; }
  .inkbar .sw { width: 28px; height: 28px; min-height: 0; padding: 0; border-radius: 50%; border: 2px solid var(--rule); }
  .inkbar .op, .oslider { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); white-space: nowrap; flex: none; padding: 0 6px; }
  .oslider input[type=range], .inkbar input[type=range] { width: 92px; accent-color: var(--accent); }
  .oslider select { font: 14px var(--font); color: var(--ink); background: var(--field); border: 0; border-radius: 8px; padding: 6px; }
  .ochip { flex: none; min-height: 32px !important; padding: 5px 12px !important; font-size: 13px !important; border-radius: 8px !important; color: var(--ink) !important; }
  .ochip[aria-pressed="true"] { background: var(--accent-soft) !important; border-color: transparent !important; }
  .swatch.custom { position: relative; overflow: hidden; display: inline-block; cursor: pointer; }
  .swatch.custom input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
  #layersPanel { position: fixed; right: 10px; top: calc(112px + env(safe-area-inset-top)); z-index: 32; width: min(320px, calc(100vw - 20px)); max-height: 62vh; overflow: auto;
    background: var(--surface); border: 1px solid var(--rule); border-radius: 16px; box-shadow: var(--shadow); padding: 8px; }
  #layersPanel .lhead { display: flex; align-items: center; gap: 6px; padding: 2px 4px 8px; }
  #layersPanel .lhead b { flex: 1; font-weight: 500; }
  #layersPanel .lhead button { min-height: 32px; padding: 4px 12px; }
  .lrow { display: flex; align-items: center; gap: 2px; border-radius: 10px; padding: 2px; }
  .lrow.on { background: var(--accent-soft); }
  .lrow .icon { width: 36px; height: 36px; font-size: 16px; color: var(--ink); }
  .lname { flex: 1; min-width: 0; cursor: pointer; padding: 8px 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lname small { color: var(--muted); }
  .lmore { display: flex; flex-direction: column; gap: 8px; padding: 8px 6px 12px; border-bottom: 1px solid var(--rule); }
  .lmore .oslider { padding: 0; }
  .lbtns { display: flex; flex-wrap: wrap; gap: 6px; }
  .lbtns button { min-height: 32px; padding: 4px 12px; font-size: 13px; }
  .stage[data-tool=select] .box { cursor: move; outline: 1px dashed var(--rule); touch-action: none; }
  .stage[data-tool=select] .box .ed { pointer-events: none; }
  .box .grip { position: absolute; left: -20px; top: 2px; width: 20px; height: 30px; display: none; place-items: center; color: var(--muted); cursor: grab; touch-action: none; }
  .box .grip svg { fill: currentColor; }
  .box.focused .grip, .box.selected .grip { display: grid; }
  .box .resize { position: absolute; right: -10px; top: 0; bottom: 0; width: 18px; cursor: ew-resize; display: none; touch-action: none; }
  .box.selected .resize, .box.focused .resize { display: block; }
  .box .resize::after { content: ""; position: absolute; left: 7px; top: 50%; width: 4px; height: 28px; margin-top: -14px; border-radius: 2px; background: var(--muted); opacity: .5; }
  .stage[data-tool=pen], .stage[data-tool=fill] { cursor: crosshair; }
  .stage[data-tool=erase], .stage[data-tool=nudge] { cursor: none; }
  .stage[data-tool=lasso] { cursor: default; }
  .sel { position: absolute; border: 1.5px dashed var(--accent); border-radius: 8px; pointer-events: none; }
  .selbar { position: absolute; z-index: 5; display: flex; gap: 6px; }
  .selbar button { min-height: 34px; padding: 6px 12px; font-size: 14px; box-shadow: var(--shadow); }

  /* The rich text inside a box */
  .ed .ProseMirror { outline: none; font: 17px/1.55 var(--font); color: var(--ink); min-height: 28px; padding: 2px; word-wrap: break-word; white-space: pre-wrap; }
  .ed .ProseMirror > *:first-child { margin-top: 0; }
  .ed .ProseMirror p { margin: 0 0 .35em; }
  .ed .ProseMirror h1 { font-size: 1.5em; margin: .3em 0; line-height: 1.25; }
  .ed .ProseMirror h2 { font-size: 1.25em; margin: .3em 0; line-height: 1.3; }
  .ed .ProseMirror h3 { font-size: 1.1em; margin: .3em 0; }
  .ed .ProseMirror ul, .ed .ProseMirror ol { padding-left: 24px; margin: .2em 0 .4em; }
  .ed .ProseMirror blockquote { margin: .3em 0; padding-left: 12px; border-left: 3px solid var(--rule); color: var(--muted); }
  .ed .ProseMirror a { color: var(--accent); }
  .ed .ProseMirror code { background: var(--accent-soft); border-radius: 4px; padding: 0 3px; }
  .ed .ProseMirror ul[data-type="taskList"] { list-style: none; padding-left: 2px; }
  .ed .ProseMirror ul[data-type="taskList"] li { display: flex; gap: 8px; align-items: flex-start; }
  .ed .ProseMirror ul[data-type="taskList"] li > label { flex: none; margin-top: 3px; }
  .ed .ProseMirror ul[data-type="taskList"] li > label input { width: 19px; height: 19px; accent-color: var(--accent); }
  .ed .ProseMirror ul[data-type="taskList"] li > div { flex: 1; min-width: 0; }
  .ed .ProseMirror ul[data-type="taskList"] li[data-checked="true"] > div { color: var(--muted); text-decoration: line-through; }
  .ed .ProseMirror p.is-editor-empty:first-child::before { content: attr(data-placeholder); color: var(--muted); opacity: .8; float: left; height: 0; pointer-events: none; }

  /* Formatting bar: shows while typing, just above the keyboard */
  #fmtBar { position: fixed; left: 0; right: 0; z-index: 30; bottom: 0; display: flex; gap: 2px; align-items: center; overflow-x: auto; scrollbar-width: none;
    padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); background: var(--surface); border-top: 1px solid var(--rule); }
  #fmtBar button { flex: none; min-width: 38px; height: 38px; min-height: 0; padding: 0 8px; border-color: transparent; background: transparent; font-size: 15px; }
  #fmtBar button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
  #fmtBar .sep { width: 1px; height: 22px; background: var(--rule); margin: 0 4px; flex: none; }
  #fmtBar .dot { display: inline-block; width: 16px; height: 16px; border-radius: 50%; vertical-align: middle; }
  .pop { position: fixed; z-index: 35; background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; box-shadow: var(--shadow); padding: 8px; display: flex; flex-wrap: wrap; gap: 6px; max-width: 290px; }
  .pop button { min-height: 36px; }
  .pop .swatch { width: 30px; height: 30px; }

  /* The note menu: a round button in the bottom-left corner */
  #menuFab { left: 16px; width: 48px; height: 48px; border-radius: 16px; }
  #menuFab.lift { bottom: calc(66px + env(safe-area-inset-bottom)); }
  #noteMenu { position: fixed; left: 16px; z-index: 36; bottom: calc(76px + env(safe-area-inset-bottom)); min-width: 240px; max-width: calc(100vw - 32px);
    background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; box-shadow: var(--shadow); padding: 6px; }
  #noteMenu.lift { bottom: calc(124px + env(safe-area-inset-bottom)); }
  #noteMenu > button { display: flex; width: 100%; align-items: center; gap: 12px; border: 0; background: transparent; padding: 12px; text-align: left; font-size: 15px; }
  #noteMenu > button:hover { background: var(--paper); }
  #noteMenu .space { display: flex; align-items: center; gap: 4px; padding: 6px 12px; font-size: 14px; color: var(--muted); }
  #noteMenu .space span { flex: 1; }
  #noteMenu .space button { width: 38px; height: 38px; min-height: 0; padding: 0; }
  #noteMenu hr { border: 0; border-top: 1px solid var(--rule); margin: 4px 0; }

  /* Sheets (dialogs) */
  .sheet-back { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.35); display: flex; align-items: flex-end; justify-content: center; }
  .sheet { width: 100%; max-width: 560px; max-height: 85vh; overflow: auto; background: var(--paper); border-radius: 28px 28px 0 0;
    padding: 18px 18px calc(18px + env(safe-area-inset-bottom)); }
  @media (min-width: 700px) { .sheet-back { align-items: center; } .sheet { border-radius: 18px; } }
  .sheet h2 { margin: 0 0 6px; font: 400 22px/1.3 var(--font); }
  .sheet p { margin: 0 0 12px; color: var(--muted); font-size: 15px; }
  .sheet ul { margin: 0 0 14px; padding-left: 18px; font-size: 15px; }
  .sheet .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .sheet .pick { display: flex; flex-direction: column; gap: 2px; margin: 8px 0; max-height: 50vh; overflow: auto; }
  .sheet .pick button { text-align: left; border: 0; background: transparent; display: flex; gap: 8px; align-items: center; }
  .sheet .pick button svg.i { color: var(--accent); flex: none; }
  .sheet .pick button[aria-pressed="true"] { background: var(--accent-soft); }
  .sheet .labels { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .sheet .labels button { border-radius: 999px; min-height: 34px; padding: 6px 12px; font-size: 14px; }
  .sheet .labels button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
  .sheet .err { color: var(--bad); font-size: 14px; margin-top: 8px; }
  .sheet .vprev { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 12px; max-height: 45vh; overflow: auto; font-size: 15px; }
  .sheet .vprev p, .sheet .vprev ul { margin: 0 0 6px; }

  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(88px + env(safe-area-inset-bottom)); z-index: 60;
    display: flex; align-items: center; gap: 12px; padding: 8px 8px 8px 16px; border-radius: 6px; background: #303030; color: #f2f2f2;
    box-shadow: var(--shadow); max-width: calc(100% - 32px); font-size: 15px; }
  .toast button { background: transparent; color: #8fd8cc; border-color: transparent; font-weight: 600; }
</style>
</head>
